# Deletes the test copy of the website (minuteman-test, made by "Deploy test
# site") and its store: the Worker, its secrets with it, and the KV namespace
# "minuteman-test-store". The live site (minuteman) isn't touched.
#
# Run it from the Actions tab ("Delete test site" → Run workflow). "Deploy
# test site" makes it again from scratch when wanted (a new store, a new
# TOKEN_KEY; the Google client's ID and secret to add again).

name: Delete test site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Delete the test Worker
        working-directory: web
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          # --force: it's bound to itself (its alerts' SELF binding).
          npx wrangler delete minuteman-test --force

      - name: Delete the test store
        working-directory: web
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          ID=$(npx wrangler kv namespace list 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const list = JSON.parse(s.slice(s.indexOf("[")));
              const hit = list.find((n) => n.title.toLowerCase().includes("minuteman-test-store"));
              process.stdout.write(hit ? hit.id : "");
            });')
          if [ -z "$ID" ]; then echo "No test store left."; exit 0; fi
          npx wrangler kv namespace delete --namespace-id "$ID" --skip-confirmation
