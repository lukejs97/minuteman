[package]
name = "calendar"
version = "0.1.0"
description = "Minuteman: a personal calendar app on top of Google Calendar"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for Google's APIs. rustls = TLS written in Rust, so no OpenSSL to install.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "fs"] }
futures = "0.3"
# OS keychain: Windows Credential Manager and macOS/iOS Keychain.
# Without these platform features keyring silently uses an in-memory mock store.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = "0.4"
# Time zones by name, for events that keep their clock time anywhere.
chrono-tz = "0.10"
thiserror = "2"

# Desktop only: pop-up alerts before events (on iPhone they'd need to be
# scheduled ahead with iOS instead); the quick-add keyboard shortcut;
# opening at login; and only one copy running.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Opening Minuteman again (the Start menu, a shortcut) shows the one that's
# running, rather than starting another with a second tray icon.
tauri-plugin-single-instance = "2"

# Mac only: Apple Calendar and Reminders (EventKit), and travel times for
# "time to leave" alerts (Core Location, MapKit).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-event-kit = "0.3"
objc2-core-location = "0.3"
objc2-map-kit = "0.3"

# Windows only: where the PC is, for drives that start from there (Settings →
# Leave from → Start from where I am), from Windows' location service.
# Also the files copied in File Explorer, for pasting them as attachments.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation", "Win32_System_WinRT", "Win32_System_DataExchange", "Win32_UI_Shell"] }

# iOS (and later Android): receives Google's sign-in redirect as a deep link.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-deep-link = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
